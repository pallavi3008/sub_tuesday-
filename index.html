<!DOCTYPE html>
<html>
    <head>
        <title>Multiplication Table</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 40px;
            }
            table {
                border-collapse: collapse;
                width: 300px;
            }
            th, td {
                border: 1px solid #333;
                padding: 10px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h2>Multiplication Table of 2</h2>
        <table>
            <tr>
                <th>Number</th>
                <th>Result</th>
            </tr>
            <tr><td>2 x 1</td><td>2</td></tr>
            <tr><td>2 x 2</td><td>4</td></tr>
            <tr><td>2 x 3</td><td>6</td></tr>
            <tr><td>2 x 4</td><td>8</td></tr>
            <tr><td>2 x 5</td><td>10</td></tr>
            <tr><td>2 x 6</td><td>12</td></tr>
            <tr><td>2 x 7</td><td>14</td></tr>
            <tr><td>2 x 8</td><td>16</td></tr>
            <tr><td>2 x 9</td><td>18</td></tr>
            <tr><td>2 x 10</td><td>20</td></tr>
        </table>
    </body>
</html>
